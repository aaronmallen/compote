name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v4
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Lint
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v4
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test
        run: mise run test
      - name: Test the doc examples
        run: cargo test --doc --all-features
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v4
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build with no features
        run: mise run build
      - name: Build with every feature
        run: mise run build --all-features

  feature:
    name: Feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - cbor
          - env
          - json
          - msgpack
          - toml
          - yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v4
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build with only the ${{ matrix.feature }} feature
        run: cargo build --locked --no-default-features --features ${{ matrix.feature }}
