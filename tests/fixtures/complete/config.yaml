# The complete configuration, spelled in YAML.
#
# Uses anchors and aliases, folded and flow styles, quoted keys, and an explicit null, so the
# reader has to handle more than a flat mapping. Merge keys are deliberately absent: the parser
# leaves `<<` as an ordinary key.

# Not part of the settings type. Unknown keys are ignored, which is what makes this pattern work.
x-anchors:
  ciphers: &ciphers
    - TLS_AES_128_GCM_SHA256
    - TLS_AES_256_GCM_SHA384
  weight: &primary-weight 0.75

name: >-
  Compote — ünïcode ✓
released: "2026-08-28"
milestones: ["2026-01-01", "2026-06-15"]
notes: []
tags: [api, web]
extra: {}

server:
  backlog: -1
  host: "0.0.0.0"
  max_body_bytes: 4294967296
  port: 8443
  headers:
    "x-greeting": "hello\tworld"
    "x-powered-by": compote
  tls:
    ciphers: *ciphers
    enabled: true
    min_version: "1.3"

database:
  url: postgres://localhost/compote
  pool:
    idle_timeout: 30.5
    max: 32
    min: 4
  replicas:
    - host: replica-1.internal
      port: 5432
      weight: *primary-weight
    - { host: replica-2.internal, port: 5433, weight: 0.25 }

features:
  beta-ui:
    enabled: true
    rollout: 5e-2
  metrics: { enabled: true, rollout: 1.0 }
  tracing: { enabled: false, rollout: 0.0 }

logging:
  level: info
  targets:
    - stdout
    - file:
        path: /var/log/compote.log
        rotate: true

owners:
  - email: hello@aaronmallen.me
    name: Aaron
  - email: ~
    name: Ops
