; The complete configuration, spelled in INI, and read with `split(".")`.
;
; Uses dotted section names, dotted keys, a repeated key, a comma-separated value, a quoted value
; carrying an escape, and a section holding nothing, so the reader has to handle every shape INI
; offers.
;
; Three of the fixture's fields are beyond the format. `database.replicas`, `owners`, and the file
; entry under `logging.targets` each want a table inside a list, and INI has no way to say one: a
; section repeated joins what is already there rather than adding to a list. All three are empty
; here, and `tests/ini.rs` says so.

