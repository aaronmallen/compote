[package]
categories = ["config", "encoding"]
description = "Layered configuration. Merge files and environment variables into one typed value."
edition = "2024"
homepage = "https://github.com/aaronmallen/compote"
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "README.md", "CHANGELOG.md"]
keywords = ["config", "configuration", "env", "layered", "settings"]
license = "MIT"
name = "compote"
repository = "https://github.com/aaronmallen/compote"
rust-version = "1.88"
version = "0.2.0"

[package.metadata]
docs.rs = { all-features = true }

[features]
cbor = ["dep:ciborium"] # Load configuration from CBOR binaries
dotenv = ["dep:dotenvy"] # Load configuration from .env files
env = [] # Load configuration from env
ini = ["dep:rust_ini"] # Load configuration from INI files
json = ["dep:jsonc-parser"] # Load configuration from JSON or JSONc files
keyring = ["dep:keyring-core"] # Load configuration from the platform keyring
msgpack = ["dep:rmp-serde"] # Load configuration from RMP binaries
toml = ["dep:toml_edit"] # Load configuration from TOML files
xml = ["dep:roxmltree"] # Load configuration from XML files
yaml = ["dep:yaml_serde"] # Load configuration from YAML files

[dependencies]
ciborium = { optional = true, version = "0.2" }
dotenvy = { optional = true, version = "0.15" }
jsonc-parser = { features = ["serde"], optional = true, version = "0.33" }
keyring-core = { optional = true, version = "1" }
rmp-serde = { optional = true, version = "1.3" }
roxmltree = { optional = true, version = "0.21" }
rust_ini = { default-features = false, optional = true, package = "rust-ini", version = "0.21" }
serde = { features = ["derive"], version = "1" }
thiserror = "2"
toml_edit = { features = ["serde"], optional = true, version = "0.25" }
yaml_serde = { optional = true, version = "0.10" }

[dev-dependencies]
keyring-core = "1"
pretty_assertions = "1"
temp-env = "0.3"
tempfile = "3"
