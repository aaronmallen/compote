name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "[0-9]+.*"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
      - name: Install tools
        uses: https://github.com/jdx/mise-action@v4
      - name: Cache cargo
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Lint
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
      - name: Install tools
        uses: https://github.com/jdx/mise-action@v4
      - name: Cache cargo
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Test
        run: mise run test
      - name: Test the doc examples
        run: cargo test --doc --all-features
      - name: Upload coverage
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
      - name: Install tools
        uses: https://github.com/jdx/mise-action@v4
      - name: Cache cargo
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Build with no features
        run: mise run build
      - name: Build with every feature
        run: mise run build --all-features

  feature:
    name: Feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - cbor
          - dotenv
          - env
          - ini
          - json
          - keyring
          - msgpack
          - toml
          - xml
          - yaml
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
      - name: Install tools
        uses: https://github.com/jdx/mise-action@v4
      - name: Cache cargo
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Build with only the ${{ matrix.feature }} feature
        run: cargo build --locked --no-default-features --features ${{ matrix.feature }}

  release:
    name: Publish release
    if: forgejo.event_name == 'push' && startsWith(forgejo.ref, 'refs/tags/')
    needs:
      - lint
      - test
      - build
      - feature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7

      - name: Install tools
        uses: https://github.com/jdx/mise-action@v4

      - name: Publish packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_REGISTRIES_FORGEJO_TOKEN: Bearer ${{ forgejo.token }}
        run: mise run publish

      - name: Extract release notes
        env:
          TAG: ${{ forgejo.ref_name }}
        run: |
          awk -v heading="## [v$TAG]" '
            /^## / { if (found) exit; found = index($0, heading) == 1; next }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          printf '\n' >> release-notes.md
          grep '^\[[^]]*\]:' CHANGELOG.md >> release-notes.md

      - name: Create the release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ forgejo.server_url }}
          repo: ${{ forgejo.repository }}
          tag: ${{ forgejo.ref_name }}
          sha: ${{ forgejo.sha }}
          title: v${{ forgejo.ref_name }}
          token: ${{ forgejo.token }}
          release-notes-file: release-notes.md
          skip-assets: true
